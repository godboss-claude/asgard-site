{% extends "base.html" %}
{% block title %}Вход — Asgard{% endblock %}
{% block content %}
<div class="card">
    <h2>Вход</h2>
    {% if error %}<div class="flash error">{{ error }}</div>{% endif %}
    <form method="post">
        <label>Логин
            <input type="text" name="username" required autocomplete="username">
        </label>
        <label>Пароль
            <input type="password" name="password" required autocomplete="current-password">
        </label>
        <button type="submit" class="btn">Войти</button>
    </form>
    <p class="muted">Нет аккаунта? <a href="{{ url_for('register') }}">Зарегистрируйся</a></p>
</div>
{% endblock %}
